appId: com.example.dsh-packager
productName: dsh-packager
directories:
  buildResources: build
  output: dist/packager
files:
  - "src/**/*"
  - "build/**/*"
  - "scripts/**/*"
  - "package.json"
  - "agent.config.yml"
  - "plugins.catalog.json"
extraResources:
  - from: "resources/node"
    to: "node"
    filter: ["**/*"]
asar: true
win:
  target: nsis
  icon: build/icon.ico
  sign: null
  signAndEditExecutable: false
mac:
  target: dmg
  icon: build/icon.icns
linux:
  target: [AppImage, deb]
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish:
  provider: github
  releaseType: draft

afterPack: scripts/after-pack.cjs
