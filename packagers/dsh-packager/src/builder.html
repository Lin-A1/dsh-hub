<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>dsh-packager — 构建器</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#12151a; --card:#161a20; --border:#232a33;
    --accent:#4f8ef7; --amber:#f0a028; --text:#e8eaed; --muted:#9aa3ad; --dim:#6b7280;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}

  /* titlebar */
  .titlebar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:#0d1013;-webkit-app-region:drag}
  .titlebar img{width:22px;height:22px;border-radius:5px}
  .titlebar b{font-size:13px;font-weight:600}
  .titlebar .sub{color:var(--muted);font-size:11px;margin-left:auto}

  /* config bar */
  .config{padding:14px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  .cfg-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:4px}
  .field span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  input,select{padding:7px 10px;background:#0c0f12;color:var(--text);border:1px solid var(--border);border-radius:7px;outline:none;font-size:12.5px;transition:border-color .15s}
  input:focus,select:focus{border-color:var(--accent)}
  #dshDir{width:300px} #productName{width:170px}

  .actions{margin-left:auto;display:flex;gap:10px;align-items:center;padding-top:16px}
  button{cursor:pointer;border-radius:7px;font-size:12.5px;font-weight:600;padding:8px 16px;border:1px solid transparent;transition:.15s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{filter:brightness(1.12)}
  .btn-ghost{background:transparent;color:var(--muted);border-color:var(--border)}
  .btn-ghost:hover{color:var(--text);border-color:#3a4553}
  .badge-ver{font-size:11px;color:var(--dim);padding:6px 10px;background:#0c0f12;border-radius:6px;border:1px solid var(--border)}

  /* add custom source */
  .addrow{margin-top:12px;display:flex;gap:10px}
  .addrow input{flex:1}

  /* main split layout */
  .main{flex:1;display:flex;overflow:hidden}
  .sidebar{width:210px;border-right:1px solid var(--border);padding:14px 0;overflow-y:auto;background:#0d1013;flex-shrink:0}
  .side-title{padding:0 16px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
  .cat-item{padding:7px 16px;font-size:12.5px;color:var(--muted);cursor:pointer;display:flex;justify-content:space-between;border-left:2px solid transparent;transition:.1s}
  .cat-item:hover{color:var(--text);background:#14181e}
  .cat-item.active{color:var(--accent);border-left-color:var(--accent);background:#12161c}
  .cat-item .n{color:var(--dim);font-size:11px}

  .content{flex:1;overflow-y:auto;padding:14px 18px}
  .toolbar{display:flex;gap:10px;margin-bottom:12px;align-items:center}
  .toolbar input{flex:1}
  .count{font-size:11px;color:var(--dim);white-space:nowrap}

  /* plugin list — link+desc rows */
  .plist{display:flex;flex-direction:column;gap:8px}
  .prow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:10px 14px;transition:.12s}
  .prow:hover{border-color:#33404f;background:#181d24}
  .prow.selected{border-color:var(--accent);background:#131c29}
  .pcheck{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
  .pinfo{flex:1;min-width:0}
  .pname{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
  .pname a{color:var(--accent);text-decoration:none;font-size:11px;font-weight:400}
  .pname a:hover{text-decoration:underline}
  .pdesc{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ptag{font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid var(--border);color:var(--dim);flex-shrink:0}
  .ptag.unique{color:var(--amber);border-color:#4a3508;background:#2a2006}

  /* log footer */
  .logwrap{border-top:1px solid var(--border);background:#0a0c0f;padding:10px 18px;max-height:160px;overflow-y:auto}
  pre#log{margin:0;font:11.5px/1.6 Consolas,ui-monospace,monospace;color:#a8b3bf;white-space:pre-wrap;word-break:break-all}
  .empty{color:var(--dim);text-align:center;padding:40px;font-size:13px}
</style>
</head>
<body>

<div class="titlebar">
  <img src="../build/icon.png" onerror="this.style.display='none'" />
  <b>dsh-packager</b>
  <span class="sub">外接插件固化 / 兼容 · 双模式构建器</span>
</div>

<div class="config">
  <div class="cfg-row">
    <div class="field"><span>DSH 源</span>
      <select id="dshSource">
        <option value="github" selected>GitHub 最新 (deepseek-ai/deepseek-harness)</option>
        <option value="local">本地路径（候选）</option>
      </select>
    </div>
    <div class="field" id="localField" style="display:none"><span>本地 DSH_DIR</span><input id="dshDir" value="../../deepseek-harness" style="width:260px" /></div>
    <div class="field"><span>模式</span>
      <select id="mode">
        <option value="fixed" selected>固化 · 不可变隔离版</option>
        <option value="compat">兼容 · 热插拔 ~/.dsh 版</option>
      </select>
    </div>
    <div class="field"><span>productName</span><input id="productName" value="dsh-fixed-demo" /></div>
    <div class="actions">
      <span id="verBadge" class="badge-ver">—</span>
      <button class="btn-ghost" onclick="fetchCatalog()">刷新</button>
      <button class="btn-primary" onclick="build()">一键出包 →</button>
    </div>
  </div>
  <div class="addrow">
    <input id="customSpec" placeholder="+ 添加自定义源：github:owner/repo · npm:@scope/pkg · file:./path（回车添加）" onkeydown="if(event.key==='Enter')addCustom()" />
  </div>
</div>

<div class="main">
  <aside class="sidebar">
    <div class="side-title">分类</div>
    <div id="catList"></div>
  </aside>
  <section class="content">
    <div class="toolbar">
      <input id="search" placeholder="搜索名称 / 描述…" oninput="render()" />
      <label style="display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted)">
        <input type="checkbox" id="onlySelected" onchange="render()" style="width:auto" /> 只看已选
      </label>
      <span id="count" class="count"></span>
    </div>
    <div id="plist" class="plist"></div>
  </section>
</div>

<div class="logwrap"><pre id="log">就绪 — 正在加载插件目录…</pre></div>

<script type="module" src="./builder.mjs"></script>
</body>
</html>
